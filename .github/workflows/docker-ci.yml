
name: Docker - construir y probar

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prueba-contenedor:
    runs-on: ubuntu-latest

    steps:
      - name: Obtener archivos del repositorio
        uses: actions/checkout@v4

      - name: Preparar constructor Docker
        uses: docker/setup-buildx-action@v3

      - name: Construir imagen sin publicarla
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: ud-docker-taller:ci

      - name: Ejecutar el contenedor
        run: docker run -d --name ud-taller-ci -p 8000:8000 ud-docker-taller:ci

      - name: Comprobar que la aplicacion responde
        run: |
          for intento in 1 2 3 4 5; do
            if curl --fail --silent http://localhost:8000/health | grep -q '"estado": "ok"'; then
              echo "Prueba aprobada: servicio HTTP disponible"
              exit 0
            fi
            sleep 2
          done
          docker logs ud-taller-ci
          exit 1

      - name: Eliminar contenedor temporal
        if: always()
        run: docker rm -f ud-taller-ci 2>/dev/null || true
